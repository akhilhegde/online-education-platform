<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LearnHub – Online courses in cloud computing, DevOps, databases, and system administration.">
    <title>{% block title %}LearnHub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="{{ url_for('home') }}" class="nav-brand">LearnHub</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Courses</a></li>
                <li><a href="{{ url_for('my_enrollments') }}">My Enrollments</a></li>
            </ul>
        </div>
    </nav>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- Page content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 LearnHub &middot; Cloud Computing Course Project</p>
        </div>
    </footer>
</body>
</html>
